<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Безопасность Pixora: SSH, ufw, HTTPS, bcrypt, JWT, rate limit, .env, бэкапы">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1c"/>
      <stop offset="1" stop-color="#141a36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec5ff">
        <animate attributeName="stop-color" values="#2ec5ff;#6a5cff;#b44dff;#2ec5ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#6a5cff">
        <animate attributeName="stop-color" values="#6a5cff;#b44dff;#2ec5ff;#6a5cff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#b44dff">
        <animate attributeName="stop-color" values="#b44dff;#2ec5ff;#6a5cff;#b44dff" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec5ff"/>
      <stop offset="0.55" stop-color="#6a5cff"/>
      <stop offset="1" stop-color="#b44dff"/>
    </linearGradient>
    <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2342"/>
      <stop offset="1" stop-color="#111731"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .t { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #eaf0ff; }
      .s { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #9aa7c7; }
      .p { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #dfe7ff; font-size: 14px; }
      @media (prefers-reduced-motion: reduce) {
        animate, animateTransform, animateMotion { display: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="460" rx="26" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#2b3a66" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200 M0 420 H1200"/>
    <path d="M60 0 V460 M120 0 V460 M180 0 V460 M240 0 V460 M300 0 V460 M360 0 V460 M420 0 V460 M480 0 V460 M540 0 V460 M600 0 V460 M660 0 V460 M720 0 V460 M780 0 V460 M840 0 V460 M900 0 V460 M960 0 V460 M1020 0 V460 M1080 0 V460 M1140 0 V460"/>
  </g>

  <text x="56" y="66" class="t" font-size="34" fill="url(#accent)">Security layers</text>
  <text x="58" y="94" class="s" font-size="17">SSH · firewall · HTTPS · bcrypt · JWT · rate limit · secrets · backups</text>

  <!-- Orbit dots -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 600 270" to="360 600 270" dur="26s" repeatCount="indefinite"/>
    <circle cx="600" cy="100" r="4" fill="#6ee7ff" filter="url(#glow)"/>
    <circle cx="770" cy="270" r="4" fill="#6a5cff" filter="url(#glow)"/>
    <circle cx="600" cy="440" r="4" fill="#b44dff" filter="url(#glow)"/>
    <circle cx="430" cy="270" r="4" fill="#2ec5ff" filter="url(#glow)"/>
    <circle cx="720" cy="150" r="3" fill="#6ee7ff" opacity="0.7"/>
    <circle cx="480" cy="390" r="3" fill="#6a5cff" opacity="0.7"/>
    <circle cx="720" cy="390" r="3" fill="#b44dff" opacity="0.7"/>
    <circle cx="480" cy="150" r="3" fill="#2ec5ff" opacity="0.7"/>
  </g>

  <!-- Connectors -->
  <g stroke="#2b3a66" stroke-width="1.4" stroke-dasharray="4 8" opacity="0.8">
    <path d="M600 270 L600 140"/>
    <path d="M600 270 L699 171"/>
    <path d="M600 270 L740 270"/>
    <path d="M600 270 L699 369"/>
    <path d="M600 270 L600 400"/>
    <path d="M600 270 L501 369"/>
    <path d="M600 270 L460 270"/>
    <path d="M600 270 L501 171"/>
  </g>

  <!-- Pills -->
  <g>
    <rect x="535" y="122" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="600" y="144" class="p" text-anchor="middle">SSH keys</text>

    <rect x="634" y="153" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="699" y="175" class="p" text-anchor="middle">ufw 22/80/443</text>

    <rect x="675" y="252" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="740" y="274" class="p" text-anchor="middle">HTTPS</text>

    <rect x="634" y="351" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="699" y="373" class="p" text-anchor="middle">bcrypt 12</text>

    <rect x="535" y="382" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="600" y="404" class="p" text-anchor="middle">JWT 7d</text>

    <rect x="436" y="351" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="501" y="373" class="p" text-anchor="middle">rate limit</text>

    <rect x="395" y="252" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="460" y="274" class="p" text-anchor="middle">.env 600</text>

    <rect x="436" y="153" width="130" height="34" rx="17" fill="url(#pill)" stroke="#2b3a66"/>
    <text x="501" y="175" class="p" text-anchor="middle">backups</text>
  </g>

  <!-- Shield -->
  <circle cx="600" cy="270" r="58" fill="#6a5cff" opacity="0.18">
    <animate attributeName="r" values="54;64;54" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.1;0.22" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <path d="M600 214 L652 236 V282 C652 316 628 340 600 352 C572 340 548 316 548 282 V236 Z"
        fill="url(#shield)" opacity="0.18" stroke="url(#shield)" stroke-width="2.2"/>
  <path d="M600 226 L640 243 V282 C640 308 622 327 600 337 C578 327 560 308 560 282 V243 Z"
        fill="none" stroke="url(#shield)" stroke-width="3"/>
  <path d="M586 278 L596 288 L616 266" fill="none" stroke="#eaf0ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="66" y="438" class="s" font-size="13" opacity="0.85">Пароли не логируются и не уходят в Telegram · значения полей формы не передаются</text>
</svg>
