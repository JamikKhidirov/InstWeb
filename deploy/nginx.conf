# ============================================================
#  Pixora — конфиг nginx
#  Положить в /etc/nginx/sites-available/pixora
#  и сделать симлинк в /etc/nginx/sites-enabled/
#
#  Схема: nginx принимает 80/443 и проксирует ВСЁ на Node (127.0.0.1:4000).
#  Node сам отдаёт собранный фронтенд (SERVE_STATIC=true) и API.
#  Так проще: один сервис, один порт, нет проблем с путями к dist.
# ============================================================

server {
    listen 80;
    listen [::]:80;

    # ЗАМЕНИТЕ на свой домен (и добавьте его в DNS до запуска certbot)
    server_name example.com www.example.com;

    client_max_body_size 1m;

    # Базовые заголовки безопасности
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Сжатие
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }
}
